            <div class="inner-wrap">

                <main class="content">

                <h1>Resources</h1>

                <section aria-labelledby="Resources-heading">

                <div class="resource-list" id="resourceContainer"></div>

                <script>
                    // 1. Perform a GET request to fetch the JSON data
                    fetch('json/resources.json')
                        .then(response => response.json())
                        .then(data => {
                            const container = document.getElementById('resourceContainer');

                            // 2. Loop through each resource and build the HTML dynamically
                            data.forEach(resource => {
                                const card = document.createElement('div');
                                card.className = 'resource-card';

                                card.innerHTML = `
                                    <img src="${resource.logo}" alt="${resource.name} Logo" class="resource-logo">
                                    <div class="resource-info">
                                        <h3>${resource.name}</h3>
                                        <p>${resource.description}</p>
                                    </div>
                                    <a href="${resource.url}" target="_blank" class="resource-link">Visit Resource</a>
                                `;

                                container.appendChild(card);
                            });
                        })
                        .catch(error => console.error('Error loading resources:', error));
                </script>

                </section>
